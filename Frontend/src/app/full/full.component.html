<mat-sidenav-container class="blue_theme light-theme" autosize autoFocus dir="ltr">

  <!-- Sleek Modern Sidebar -->
  <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" class="sidebarNav">

    <div class="flex-layout">

      <div class="sidebar-header">
        <a href="/" class="logodark" aria-label="AeroAssist Home">
          <img src="/assets/images/logos/fintech_logo.jpeg" alt="AeroAssist Logo" />
        </a>
      </div>

      <!-- Sidenav Items with Smooth Scroll -->
      <ng-scrollbar class="sidebar-scroll" style="height: calc(100vh - 60px)">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems; track item.displayName) {
            <app-nav-item [item]="item" (notify)="leftsidenav.toggle()"></app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
    </div>

  </mat-sidenav>

  <!-- Main Content Wrapper -->
  <mat-sidenav-content class="contentWrapper" #content>

    <!-- Sleek Top Navbar -->
    <header class="top-nav-header">
      <div class="header-left">
        <button mat-icon-button (click)="leftsidenav.toggle()" class="toggle-btn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
          <mat-icon>menu</mat-icon>
        </button>

        <div class="header-brand-badge">
          <span class="badge-dot"></span>
          <span class="badge-text">AERO ASSIST PORTAL</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Notification Dropdown -->
        <app-notification></app-notification>

        <!-- User Profile Card -->
        <div class="user-profile-card">
          <div class="user-avatar-circle" [title]="username">
            <span>{{ userInitials }}</span>
          </div>

          <div class="user-info-text">
            <span class="nav-username">{{ username || 'System Super Administrator' }}</span>
            <span class="nav-user-role-badge">{{ role || 'Super Administrator' }}</span>
          </div>
        </div>

        <div class="header-divider"></div>

        <!-- Distinct Sign Out Button -->
        <button 
          mat-button 
          class="logout-btn-full" 
          (click)="logout()" 
          title="Sign out of your account"
          aria-label="Sign Out">
          <mat-icon>logout</mat-icon>
          <span>Sign Out</span>
        </button>
      </div>
    </header>

    <!-- Page Content Area -->
    <main class="pageWrapper">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
