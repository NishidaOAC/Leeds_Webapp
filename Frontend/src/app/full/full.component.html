<mat-sidenav-container class="blue_theme light-theme" autosize autoFocus dir="ltr">

  <!-- Compact Sidebar -->
  <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" class="sidebarNav">

    <div class="flex-layout">

      <div class="sidebar-header">
        <a href="/" class="logodark">
          <img src="assets/images/logos/fintech_logo.jpeg" alt="AeroAssist Logo" />
        </a>
      </div>

      <!-- Properly set height scrollbar -->
      <ng-scrollbar class="sidebar-scroll" style="height: calc(100vh - 44px)">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems; track item) {
          <app-nav-item [item]="item" (notify)="leftsidenav.toggle()"></app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
    </div>

  </mat-sidenav>

  <!-- Main Content Wrapper -->
  <mat-sidenav-content class="contentWrapper" #content>

    <!-- Ultra-Compact Top Navbar -->
    <header class="top-nav-header">
      <div class="header-left">
        <button mat-icon-button (click)="leftsidenav.toggle()" class="toggle-btn" aria-label="Toggle Sidebar">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <div class="header-right">
        <!-- Notification Bell -->
        <div class="notification-box">
          <button mat-icon-button class="icon-btn" aria-label="Notifications">
            <mat-icon>notifications</mat-icon>
          </button>
          <span class="badge">1</span>
        </div>

        <!-- Compact User Profile -->
        <div class="user-profile-nav">
          <div class="user-avatar-circle">
            <span>SA</span>
          </div>

          <div class="user-info-text">
            <span class="nav-username">{{ username || 'System Super Administrator' }}</span>
            <span class="nav-user-role">{{ role || 'superadmin' }}</span>
          </div>

          <button mat-icon-button class="logout-icon" (click)="logout()" title="Logout" aria-label="Logout">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Content Area (Reduced top margin) -->
    <main class="pageWrapper">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
