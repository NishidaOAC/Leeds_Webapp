@if(!item.navCap && !item.external && hasAccess(item)) {
  <a mat-list-item (click)="onItemSelected(item)" [ngClass]="{
      activeMenu: item.route ? router.isActive(item.route, true) : false, 
      expanded: expanded,
      disabled: item.disabled
    }" class="menu-list-item">
    
    <mat-icon class="routeIcon">{{ item.iconName || 'grid_view' }}</mat-icon>
    <span class="hide-menu">{{ item.displayName }}</span>

    @if(item.children && item.children.length) {
      <span class="arrow-icon">
        <mat-icon [@indicatorRotate]="expanded ? 'expanded' : 'collapsed'">
          expand_more
        </mat-icon>
      </span>
    }
  </a>

  <!-- Ensure children container ONLY renders when expanded -->
  @if (expanded && item.children && item.children.length) {
    <div class="children-container">
      @for (child of item.children; track child) {
        <app-nav-item [item]="child" [depth]="depth + 1"></app-nav-item>
      }
    </div>
  }
}
